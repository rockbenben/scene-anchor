name: Unit Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev cmake ninja-build
      - run: cmake -S tests -B build_tests -G Ninja
      - run: cmake --build build_tests
      - run: ctest --test-dir build_tests --output-on-failure
